version: '3.9'

services:
  # PostgreSQL Database
  db:
    image: postgres:16-alpine
    container_name: finflow-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-finflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finflow_password}
      POSTGRES_DB: ${POSTGRES_DB:-finflow_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finflow_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: finflow-redis
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FastAPI Backend
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: finflow-backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-finflow_user}:${POSTGRES_PASSWORD:-finflow_password}@db:5432/${POSTGRES_DB:-finflow_db}
      REDIS_URL: redis://redis:6379/0
      SECRET_KEY: ${SECRET_KEY:-change-this-in-production}
      APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY}
      EXCHANGERATE_API_KEY: ${EXCHANGERATE_API_KEY:-}
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-10080}
    ports:
      - "8001:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend
    command: uvicorn backend.main:app --host 0.0.0.0 --port 8000

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://finflow.fortressintelligence.space/api
    container_name: finflow-frontend
    environment:
      NEXT_PUBLIC_API_URL: https://finflow.fortressintelligence.space/api
    ports:
      - "3001:3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:

networks:
  default:
    name: finflow-network
